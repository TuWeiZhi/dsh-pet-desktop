[package]
name = "dsh-pet-tauri"
version = "0.7.7"
description = "Windows desktop pet with the original standalone host"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

[dependencies]
tauri = { version = "=2.9.5", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "=2.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
percent-encoding = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
