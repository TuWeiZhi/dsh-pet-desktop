# 发版流水线：推一个 `v*` 形式的 tag，就会在这里构建 NSIS 安装包并挂到同名 Release 上。
#
# 为什么放在 CI 而不是本地：安装包 173 MB，本地构建产物不入库（见 .gitignore 的 dist/），
# 想让「代码 → 可下载的 exe」这条链可复现，就得有个干净的 Windows 环境跑一次。
#
# 注意：这里不签名（没有证书），Windows 首次运行会弹 SmartScreen 提示，属预期。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: 发版前自检
        run: node tools/verify-desktop.mjs

      - name: 便签、动画与托盘回归测试
        run: node --experimental-strip-types --test src/host/desktop-settings.test.ts src/host/config.test.ts src/host/note.test.ts src/host/note-storage.test.ts src/host/pointer-target.test.ts src/host/desktop-reload.test.ts src/host/desktop-updates.test.ts src/host/note-pages.test.cjs src/host/desktop-sleep.test.cjs src/host/note-animation.test.cjs src/host/note-film.test.cjs src/host/desktop-random.test.cjs src/shared/pickers.test.ts

      - name: 安装依赖
        run: npm ci

      - name: 构建 NSIS 安装程序
        # --publish never：tag 触发时 electron-builder 会「隐式发布」到 GitHub Releases，
        # 但它要 GH_TOKEN 而这里不需要（上传交给下一步的 action-gh-release）。
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 生成更新校验信息
        run: node tools/write-update-manifest.cjs

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dsh-pet-*-setup.exe
            dist/dsh-pet-*-setup.exe.blockmap
            dist/update-manifest.json
          generate_release_notes: true
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
